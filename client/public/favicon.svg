<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.32" />
    </filter>
  </defs>

  <!-- Background App Icon Squircle -->
  <rect width="512" height="512" rx="120" fill="url(#brandGrad)" />
  
  <!-- Subtle top-edge glass highlight -->
  <rect x="24" y="24" width="464" height="220" rx="96" fill="white" fill-opacity="0.08" />

  <!-- Calendar Body with Drop Shadow -->
  <g filter="url(#shadow)">
    <!-- Main Card Body -->
    <rect x="88" y="104" width="336" height="324" rx="40" fill="#FFFFFF" />

    <!-- Top Month/Header Bar -->
    <path d="M88 144 C88 121.909 105.909 104 128 104 L384 104 C406.091 104 424 121.909 424 144 L424 184 L88 184 Z" fill="url(#headerGrad)" />

    <!-- Calendar Rings -->
    <rect x="152" y="72" width="28" height="64" rx="14" fill="#FFFFFF" stroke="#4338CA" stroke-width="4" />
    <rect x="332" y="72" width="28" height="64" rx="14" fill="#FFFFFF" stroke="#4338CA" stroke-width="4" />

    <!-- Timetable Slots / Cells -->
    <!-- Row 1 -->
    <rect x="124" y="216" width="76" height="48" rx="12" fill="#4F46E5" fill-opacity="0.92" />
    <rect x="218" y="216" width="76" height="48" rx="12" fill="#06B6D4" fill-opacity="0.92" />
    <rect x="312" y="216" width="76" height="48" rx="12" fill="#E0E7FF" />

    <!-- Row 2 -->
    <rect x="124" y="280" width="76" height="48" rx="12" fill="#CFFAFE" />
    <rect x="218" y="280" width="76" height="48" rx="12" fill="#4F46E5" fill-opacity="0.92" />
    <rect x="312" y="280" width="76" height="48" rx="12" fill="#10B981" fill-opacity="0.92" />

    <!-- Row 3 -->
    <rect x="124" y="344" width="76" height="48" rx="12" fill="#6366F1" fill-opacity="0.92" />
    <rect x="218" y="344" width="76" height="48" rx="12" fill="#D1FAE5" />
    <rect x="312" y="344" width="76" height="48" rx="12" fill="#06B6D4" fill-opacity="0.92" />
  </g>
</svg>
